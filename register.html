<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav id="navbar"></nav>

    <div class="container">
        <h1>Create account</h1>
        <p class="auth-subtitle">Join the forum to post and reply to threads.</p>

        <form id="register-form">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>

            <div class="password-field">
                <input type="password" name="password" placeholder="Password" required>
                <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" name="terms" required>
                I agree to the <a href="#">forum rules</a>
            </label>

            <p class="error-message" id="error-message"></p>
            <button type="submit">Register</button>
        </form>

        <p class="auth-footer-link">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script type="module" src="js/components/navbar.js"></script>
    <script type="module" src="js/pages/register.js"></script>
</body>
</html>
