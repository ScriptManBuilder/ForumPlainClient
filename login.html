<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav id="navbar"></nav>

    <div class="container">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Login to continue to the forum.</p>

        <form id="login-form">
            <input type="email" name="email" placeholder="Email" required>

            <div class="password-field">
                <input type="password" name="password" placeholder="Password" required>
                <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
            </div>

            <p class="error-message" id="error-message"></p>
            <button type="submit">Login</button>
        </form>

        <p class="auth-footer-link">Don't have an account? <a href="register.html">Register</a></p>
    </div>

    <script type="module" src="js/components/navbar.js"></script>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
