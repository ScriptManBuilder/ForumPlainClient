<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Thread</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav id="navbar"></nav>

    <div class="container">
                <h1>New Thread</h1>
        <form id="create-thread-form">
            <select name="categoryId" id="category-select" required></select>
            <input type="text" name="title" placeholder="Thread title" required>
            <label>
                <input type="checkbox" name="isAnonymous">
                Post anonymously
            </label>
            <p class="error-message" id="error-message"></p>
            <button type="submit">Create</button>
        </form>
    </div>

    <script type="module" src="js/components/navbar.js"></script>
    <script type="module" src="js/pages/create-thread.js"></script>
</body>
</html>
